<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="1000" height="1030" viewBox="0 0 1000 1030"><ns0:defs><ns0:marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><ns0:path d="M0,0 L0,6 L9,3 z" fill="#000000" /></ns0:marker></ns0:defs><ns0:rect width="100%" height="100%" fill="#FFFFFF" /><ns0:text x="40" y="50" font-family="Arial" font-weight="bold" font-size="27" fill="#000000">Smart Waste Detective / Workflow</ns0:text><ns0:rect x="270" y="85" width="460" height="65" rx="14" fill="#FFFFFF" stroke="#000000" /><ns0:text x="500.0" y="124.5" text-anchor="middle" font-family="Arial" font-size="18" fill="#000000">Start</ns0:text><ns0:path d="M500,150 L500,175" stroke="#000000" stroke-width="2.3" fill="none" marker-end="url(#a)" /><ns0:rect x="270" y="175" width="460" height="65" rx="14" fill="#FFFFFF" stroke="#000000" /><ns0:text x="500.0" y="214.5" text-anchor="middle" font-family="Arial" font-size="18" fill="#000000">Upload image / Camera capture</ns0:text><ns0:path d="M500,240 L500,265" stroke="#000000" stroke-width="2.3" fill="none" marker-end="url(#a)" /><ns0:rect x="270" y="265" width="460" height="65" rx="14" fill="#FFFFFF" stroke="#000000" /><ns0:text x="500.0" y="304.5" text-anchor="middle" font-family="Arial" font-size="18" fill="#000000">Validate format, bytes and pixels</ns0:text><ns0:path d="M500,330 L500,355" stroke="#000000" stroke-width="2.3" fill="none" marker-end="url(#a)" /><ns0:rect x="270" y="355" width="460" height="65" rx="14" fill="#FFFFFF" stroke="#000000" /><ns0:text x="500.0" y="394.5" text-anchor="middle" font-family="Arial" font-size="18" fill="#000000">EXIF transpose / RGB / Resize</ns0:text><ns0:path d="M500,420 L500,445" stroke="#000000" stroke-width="2.3" fill="none" marker-end="url(#a)" /><ns0:rect x="270" y="445" width="460" height="65" rx="14" fill="#FFFFFF" stroke="#000000" /><ns0:text x="500.0" y="484.5" text-anchor="middle" font-family="Arial" font-size="18" fill="#000000">CLIP image and text encoders</ns0:text><ns0:path d="M500,510 L500,535" stroke="#000000" stroke-width="2.3" fill="none" marker-end="url(#a)" /><ns0:rect x="270" y="535" width="460" height="65" rx="14" fill="#FFFFFF" stroke="#000000" /><ns0:text x="500.0" y="574.5" text-anchor="middle" font-family="Arial" font-size="18" fill="#000000">Class scores / Confidence checks</ns0:text><ns0:path d="M270,297 L90,297" stroke="#000000" stroke-width="2.3" fill="none" marker-end="url(#a)" /><ns0:text x="190.0" y="289.0" font-family="Arial" font-size="16" fill="#000000">Invalid</ns0:text><ns0:rect x="20" y="330" width="185" height="70" rx="14" fill="#FFFFFF" stroke="#000000" /><ns0:text x="112.5" y="360.0" text-anchor="middle" font-family="Arial" font-size="18" fill="#000000">Show error</ns0:text><ns0:text x="112.5" y="384.0" text-anchor="middle" font-family="Arial" font-size="18" fill="#000000">Retry</ns0:text><ns0:path d="M90,297 L90,330" stroke="#000000" stroke-width="2.3" fill="none" marker-end="url(#a)" /><ns0:path d="M380,600 L250,655" stroke="#000000" stroke-width="2.3" fill="none" marker-end="url(#a)" /><ns0:text x="325.0" y="619.5" font-family="Arial" font-size="16" fill="#000000">Accepted</ns0:text><ns0:path d="M620,600 L750,655" stroke="#000000" stroke-width="2.3" fill="none" marker-end="url(#a)" /><ns0:text x="695.0" y="619.5" font-family="Arial" font-size="16" fill="#000000">Uncertain</ns0:text><ns0:rect x="60" y="655" width="380" height="85" rx="14" fill="#FFFFFF" stroke="#000000" /><ns0:text x="250.0" y="692.5" text-anchor="middle" font-family="Arial" font-size="18" fill="#000000">Show waste category</ns0:text><ns0:text x="250.0" y="716.5" text-anchor="middle" font-family="Arial" font-size="18" fill="#000000">Show disposal guidance</ns0:text><ns0:rect x="560" y="655" width="380" height="85" rx="14" fill="#FFFFFF" stroke="#000000" /><ns0:text x="750.0" y="692.5" text-anchor="middle" font-family="Arial" font-size="18" fill="#000000">Unknown / Uncertain</ns0:text><ns0:text x="750.0" y="716.5" text-anchor="middle" font-family="Arial" font-size="18" fill="#000000">Retake or check manually</ns0:text><ns0:path d="M250,740 L250,780" stroke="#000000" stroke-width="2.3" fill="none" marker-end="url(#a)" /><ns0:path d="M750,740 L750,780" stroke="#000000" stroke-width="2.3" fill="none" marker-end="url(#a)" /><ns0:rect x="60" y="780" width="380" height="70" rx="14" fill="#FFFFFF" stroke="#000000" /><ns0:text x="250.0" y="822.0" text-anchor="middle" font-family="Arial" font-size="18" fill="#000000">Save result to SQLite</ns0:text><ns0:rect x="560" y="780" width="380" height="70" rx="14" fill="#FFFFFF" stroke="#000000" /><ns0:text x="750.0" y="822.0" text-anchor="middle" font-family="Arial" font-size="18" fill="#000000">Save uncertain status to SQLite</ns0:text><ns0:path d="M250,850 L380,900" stroke="#000000" stroke-width="2.3" fill="none" marker-end="url(#a)" /><ns0:path d="M750,850 L620,900" stroke="#000000" stroke-width="2.3" fill="none" marker-end="url(#a)" /><ns0:rect x="270" y="900" width="460" height="70" rx="14" fill="#FFFFFF" stroke="#000000" /><ns0:text x="500.0" y="942.0" text-anchor="middle" font-family="Arial" font-size="18" fill="#000000">Dashboard / History / End</ns0:text></ns0:svg>